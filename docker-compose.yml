services:
  app:
    # Prebuilt release image - `docker compose pull` grabs it; `build` still
    # works for local development from source.
    image: ghcr.io/graphichealer/stache:latest
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      TZ: ${TZ:-UTC}   # digest "time" setting uses this timezone
      # Reverse-proxy/tunnel support (set in .env, never committed):
      STACHE_BASE_URL: ${STACHE_BASE_URL:-}        # public origin, e.g. https://stache.example.com
      STACHE_TRUSTED_ORIGINS: ${STACHE_TRUSTED_ORIGINS:-}
      STACHE_TRUST_PROXY: ${STACHE_TRUST_PROXY:-0} # 1 to honor X-Forwarded-* from the proxy
    volumes:
      - data:/data   # SQLite db + photos + model cache all live here
    ports:
      - "8080:8080"
    # Lets the AI provider URL reach services on the Docker host
    # (e.g. Ollama at http://host.docker.internal:11434/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  data:
