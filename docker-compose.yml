services:
  app:
    # Prebuilt release image - `docker compose pull` grabs it; `build` still
    # works for local development from source.
    image: ghcr.io/graphichealer/stash:latest
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /data
      TZ: ${TZ:-UTC}   # digest "time" setting uses this timezone
    volumes:
      - stash_data:/data   # SQLite db + photos + model cache all live here
    ports:
      - "8080:8080"
    # Lets the AI provider URL reach services on the Docker host
    # (e.g. Ollama at http://host.docker.internal:11434/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  stash_data:
