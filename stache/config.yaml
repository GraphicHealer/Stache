name: Stache
version: "0.1.1"
slug: stache
description: Photo-first home inventory - "Where is my stuff?"
url: https://github.com/GraphicHealer/Stache
arch:
  - aarch64
  - amd64
init: false
image: ghcr.io/graphichealer/stache
startup: application
boot: auto
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web interface
webui: http://[HOST]:[PORT:8080]/
watchdog: http://[HOST]:[PORT:8080]/api/health
