# Build + push the app image when a GitHub Release is published.
# The release tag (e.g. v1.2.0) is baked into the UI via APP_VERSION.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.event.release.tag_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the HA add-on's version in lockstep with the image tag so the
      # store's update prompt always points at a published image.
      - name: Sync add-on version
        run: |
          # The release checkout sits on the tag - push must come from main or
          # a non-fast-forward is possible (release tags aren't always HEAD).
          git fetch origin main
          git checkout main
          # Image tags are semver without the leading v (metadata-action pattern).
          sed -i "s/^version:.*/version: \"${GITHUB_REF_NAME#v}\"/" stache/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stache/config.yaml
          git commit -m "Bump add-on version to ${{ github.event.release.tag_name }}" || echo "no change"
          git push origin HEAD:main
