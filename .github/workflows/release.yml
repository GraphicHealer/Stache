# Build + push the app image when a GitHub Release is published.
# The release tag (e.g. v1.2.0) is baked into the UI via APP_VERSION.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  # Gate: the image only builds if the full validation pipeline passes.
  ci:
    uses: ./.github/workflows/ci.yml
  validate:
    uses: ./.github/workflows/app-validation.yml

  docker:
    needs: [ci, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.event.release.tag_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the HA add-on's version in lockstep with the image tag so the
      # store's update prompt always points at a published image.
      - name: Sync add-on version
        run: |
          # The release checkout sits on the tag - push must come from main or
          # a non-fast-forward is possible (release tags aren't always HEAD).
          git fetch origin main
          git checkout main
          # Image tags are semver without the leading v (metadata-action pattern).
          sed -i "s/^version:.*/version: \"${GITHUB_REF_NAME#v}\"/" stache/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stache/config.yaml
          git commit -m "Bump add-on version to ${{ github.event.release.tag_name }}" || echo "no change"
          git push origin HEAD:main
